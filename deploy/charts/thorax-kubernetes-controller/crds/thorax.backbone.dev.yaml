        x-kubernetes-validations:
        - message: at least one data mapping is required
          rule: size(self.spec.data) > 0
        - message: at most 256 data mappings are allowed
          rule: size(self.spec.data) <= 256
        - message: Kubernetes-generated credential types cannot be projected
