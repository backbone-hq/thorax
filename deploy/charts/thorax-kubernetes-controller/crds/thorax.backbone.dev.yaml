apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: thoraxjoinrequests.thorax.backbone.dev
spec:
  group: thorax.backbone.dev
  names:
    kind: ThoraxJoinRequest
    plural: thoraxjoinrequests
    shortNames:
    - tjoin
    singular: thoraxjoinrequest
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ThoraxJoinRequestSpec via `CustomResource`
        properties:
          spec:
            properties:
              artifact:
                description: |-
                  Base64 of the canonical `JoinCandidateStore` bytes. Mirrored fields above are
                  reviewable indexes and must match this signed artifact exactly.
                maxLength: 262144
                minLength: 1
                type: string
              encryptionPublicKey:
                maxLength: 4096
                minLength: 1
                type: string
              entryPoint:
                maxLength: 262144
                nullable: true
                type: string
              proof:
                maxLength: 4096
                minLength: 1
                type: string
              purpose:
                enum:
                - Enroll
                - RestoreTrust
                type: string
              requestID:
                maxLength: 4096
                minLength: 1
                type: string
              signingPublicKey:
                maxLength: 4096
                minLength: 1
                type: string
              suggestedSelectors:
                default: []
                items:
                  maxLength: 1024
                  minLength: 1
                  type: string
                maxItems: 256
                type: array
              trustedRoot:
                maxLength: 4096
                minLength: 1
                type: string
              userID:
                maxLength: 4096
                minLength: 1
                type: string
              vaultRef:
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - artifact
            - encryptionPublicKey
            - proof
            - purpose
            - requestID
            - signingPublicKey
            - trustedRoot
            - userID
            - vaultRef
            type: object
          status:
            nullable: true
            properties:
              phase:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: ThoraxJoinRequest
        type: object
        x-kubernetes-validations:
        - message: join request specs are immutable
          rule: self.spec == oldSelf.spec
        - message: Enroll requires an entry point
          rule: self.spec.purpose != 'Enroll' || has(self.spec.entryPoint)
        - message: RestoreTrust cannot carry an entry point
          rule: self.spec.purpose != 'RestoreTrust' || !has(self.spec.entryPoint)
    served: true
    storage: true
    subresources:
      status: {}
