          rule: '!has(self.spec.template.metadata) || !has(self.spec.template.metadata.annotations) || self.spec.template.metadata.annotations.all(key, !key.startsWith(''thorax.backbone.dev/'') && !key.startsWith(''kubernetes.io/service-account.''))'
        - message: label keys and values exceed the projection limits
          rule: '!has(self.spec.template.metadata) || !has(self.spec.template.metadata.labels) || self.spec.template.metadata.labels.all(key, size(key) <= 253 && size(self.spec.template.metadata.labels[key]) <= 63)'
        - message: annotation keys and values exceed the projection limits
          rule: '!has(self.spec.template.metadata) || !has(self.spec.template.metadata.annotations) || self.spec.template.metadata.annotations.all(key, size(key) <= 253 && size(self.spec.template.metadata.annotations[key]) <= 4096)'
        - message: every projected data key must use Kubernetes Secret key syntax
          rule: self.spec.data.all(key, key.matches('^[-._a-zA-Z0-9]+$'))
        - message: selectors must identify explicit non-empty records
          rule: self.spec.data.all(key, self.spec.data[key].selector != '')
