{{- if and .Values.podDisruptionBudget.create (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "thorax-kubernetes-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thorax-kubernetes-controller.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "thorax-kubernetes-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
