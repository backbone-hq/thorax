name: Release Artifacts
run-name: Release v${{ inputs.version }} (${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from Cargo.toml, without leading v"
        required: true
        type: string
      dispatch_id:
        description: "Private release-driver correlation identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate protected release input
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the protected release branch and exact version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/v$REQUESTED_VERSION"
          test "$GITHUB_REF" = "$expected_ref" || {
            echo "releases must run from $expected_ref, not $GITHUB_REF" >&2
            exit 1
          }
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "only stable major.minor.patch releases are supported" >&2
            exit 1
          }
          [[ "$DISPATCH_ID" =~ ^[0-9a-f]{32}$ ]] || {
            echo "invalid release dispatch identifier" >&2
            exit 1
          }
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "$version" = "$REQUESTED_VERSION" || {
            echo "workflow requested version $REQUESTED_VERSION, Cargo.toml has $version" >&2
            exit 1
          }

  quality-gate:
    name: Complete release quality gate
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-kubernetes-controller:
    name: Build Kubernetes controller image ${{ matrix.platform }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            label: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            label: arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/backbone-hq/thorax-kubernetes-controller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compile each image on its native architecture. Building arm64 under
      # QEMU made this Rust build take an hour on the amd64 runner.
      - name: Build and publish controller image by digest
        id: controller-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: deploy/thorax-kubernetes-controller.Dockerfile
          platforms: ${{ matrix.platform }}
          # Keep architectures in separate cache scopes. This makes a retry of
          # the same release reuse the completed Docker/Rust build instead of
          # recompiling it, without allowing amd64 and arm64 layers to collide.
          cache-from: type=gha,scope=controller-${{ matrix.label }}
          cache-to: type=gha,scope=controller-${{ matrix.label }},mode=max,ignore-error=true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}

      - name: Stage controller image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.controller-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p /tmp/controller-digests
          touch "/tmp/controller-digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload controller image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorax-kubernetes-controller-digest-${{ matrix.label }}
          path: /tmp/controller-digests/*
          if-no-files-found: error

  package-kubernetes-controller:
    name: Assemble Kubernetes controller image and chart
    needs:
      - quality-gate
      - build-kubernetes-controller
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/backbone-hq/thorax-kubernetes-controller
      STAGING_IMAGE: ghcr.io/backbone-hq/thorax-kubernetes-controller:build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download controller image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: thorax-kubernetes-controller-digest-*
          path: /tmp/controller-digests
          merge-multiple: true

      - name: Assemble run-scoped controller image
        id: controller-image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digests < <(find /tmp/controller-digests -maxdepth 1 -type f -printf '%f\n' | sort)
          (( ${#digests[@]} == 2 ))
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          metadata_file=/tmp/controller-image-metadata.json
          docker buildx imagetools create --tag "$STAGING_IMAGE" \
            --metadata-file "$metadata_file" \
            "${sources[@]}"
          image_digest="$(jq -er '."containerimage.descriptor".digest' "$metadata_file")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"

      - name: Package Helm chart
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.20.0

      - name: Stage chart
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.controller-image.outputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          helm lint deploy/charts/thorax-kubernetes-controller \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          mkdir -p dist
          cp -R deploy/charts/thorax-kubernetes-controller /tmp/thorax-kubernetes-controller-chart
          sed -i \
            "s|^  digest: \"\"|  digest: \"$IMAGE_DIGEST\"|" \
            /tmp/thorax-kubernetes-controller-chart/values.yaml
          grep -Fq "digest: \"$IMAGE_DIGEST\"" \
            /tmp/thorax-kubernetes-controller-chart/values.yaml
          helm package /tmp/thorax-kubernetes-controller-chart \
            --version "$RELEASE_VERSION" \
            --app-version "$RELEASE_VERSION" \
            --destination dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorax-kubernetes-controller-chart
          path: dist/thorax-kubernetes-controller-*.tgz
          if-no-files-found: error

  build-cli:
    name: Build ${{ matrix.target }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: thorax-x86_64-unknown-linux-gnu
            binary: thorax
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: thorax-aarch64-unknown-linux-gnu
            binary: thorax
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: thorax-x86_64-apple-darwin
            binary: thorax
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: thorax-aarch64-apple-darwin
            binary: thorax
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: thorax-x86_64-pc-windows-msvc.exe
            binary: thorax.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Build thorax
        shell: bash
        run: cargo build --locked --release -p thorax --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ARTIFACT"
          chmod 755 "dist/$ARTIFACT" || true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-python:
    name: Build Python wheel ${{ matrix.label }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
          - os: windows-2025
            label: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: build
          working-directory: crates/thorax-py
          manylinux: ${{ startsWith(matrix.os, 'ubuntu-') && '2_28' || 'auto' }}
          rust-toolchain: 1.92.0
          args: --locked --release --compatibility pypi --out ../../dist

      - name: Upload Python wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorax-python-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  build-install-bootstrap:
    name: Build install bootstrap ${{ matrix.target }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: thorax-install-bootstrap-x86_64-unknown-linux-gnu
            binary: thorax-install-bootstrap
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: thorax-install-bootstrap-aarch64-unknown-linux-gnu
            binary: thorax-install-bootstrap
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: thorax-install-bootstrap-x86_64-apple-darwin
            binary: thorax-install-bootstrap
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: thorax-install-bootstrap-aarch64-apple-darwin
            binary: thorax-install-bootstrap

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Build install bootstrap
        run: cargo build --locked --release -p thorax-update --bin thorax-install-bootstrap --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ARTIFACT"
          chmod 755 "dist/$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-node-native:
    name: Build Node native ${{ matrix.label }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            label: linux-x64-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04
            label: linux-arm64-musl
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
          - os: macos-14
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2025
            label: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-2025
            label: windows-arm64
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Install Zig for musl cross-compilation
        if: ${{ contains(matrix.target, 'musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild for musl cross-compilation
        if: ${{ contains(matrix.target, 'musl') }}
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-zigbuild

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install locked Node build dependencies
        working-directory: crates/thorax-node
        run: npm ci --ignore-scripts

      - name: Build Node native addon
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd crates/thorax-node
          build_args=(--platform --release --target "$TARGET")
          case "$TARGET" in
            *-linux-gnu) build_args+=(--use-napi-cross) ;;
            *-linux-musl) build_args+=(--cross-compile) ;;
          esac
          npx --no-install napi build "${build_args[@]}"
          mkdir -p ../../dist-node
          cp thorax.*.node ../../dist-node/

      - name: Upload Node native addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorax-node-native-${{ matrix.label }}
          path: dist-node/*.node
          if-no-files-found: error

  package-node:
    name: Package Node SDK
    needs:
      - quality-gate
      - build-node-native
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Download Node native addons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: thorax-node-native-*
          path: node-native
          merge-multiple: true

      - name: Pack Node SDK
        shell: bash
        run: |
          set -euo pipefail
          cp node-native/*.node crates/thorax-node/
          cd crates/thorax-node
          THORAX_ASSERT_PACKAGED_BINDINGS=1 node --test loader.test.js
          node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.version = process.env.THORAX_VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          mkdir -p ../../dist
          npm pack --pack-destination ../../dist
        env:
          THORAX_VERSION: ${{ inputs.version }}

      - name: Upload Node package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thorax-node-package
          path: dist/*.tgz
          if-no-files-found: error
