name: CI

on:
  workflow_call:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Check release version consistency
        run: scripts/bump-version.sh --check

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check locked Node build dependencies
        working-directory: crates/thorax-node
        run: npm ci --ignore-scripts

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check generated Kubernetes CRDs
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p thorax-kubernetes-api --example crdgen > /tmp/thorax-crds.yaml
          diff -u deploy/charts/thorax-kubernetes-controller/crds/thorax.backbone.dev.yaml /tmp/thorax-crds.yaml

      - name: Lint Kubernetes controller chart
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Helm lint
        run: >-
          helm lint deploy/charts/thorax-kubernetes-controller
          --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Check security invariants
        run: deploy/tests/security-static.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust advisories
        run: cargo audit

      - name: Check docs
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

      - name: Run tests
        # pyo3/extension-module deliberately leaves Python symbols for the
        # interpreter to resolve and cannot be linked into a standalone Rust
        # test harness on Unix. Clippy covers that feature; wheel jobs exercise
        # the actual extension-module build.
        run: cargo test --locked --workspace

  kubernetes-e2e:
    name: Kubernetes and CloudNativePG acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.92.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0

      - name: Create disposable kind cluster
        shell: bash
        run: |
          set -euo pipefail
          version=v0.32.0
          expected=50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          curl -fsSL --retry 3 -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${version}/kind-linux-amd64"
          actual=$(sha256sum /tmp/kind | awk '{print $1}')
          test "$expected" = "$actual"
          chmod 755 /tmp/kind
          /tmp/kind create cluster --name thorax-e2e --kubeconfig /tmp/thorax-e2e.kubeconfig --wait 120s

      - name: Build and load hardened controller image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file deploy/thorax-kubernetes-controller.Dockerfile \
            --tag thorax-kubernetes-controller:e2e \
            .
          /tmp/kind load docker-image thorax-kubernetes-controller:e2e \
            --name thorax-e2e

      - name: Run Thorax and CloudNativePG acceptance
        run: deploy/tests/cnpg-e2e.sh
        env:
          KUBECONFIG: /tmp/thorax-e2e.kubeconfig
          THORAX_E2E_DISPOSABLE_CLUSTER: "yes"
          THORAX_E2E_NAMESPACE: thorax-e2e-ci
          THORAX_E2E_CONTROLLER_REPOSITORY: thorax-kubernetes-controller
          THORAX_E2E_CONTROLLER_TAG: e2e

      - name: Delete disposable cluster
        if: always()
        run: /tmp/kind delete cluster --name thorax-e2e
