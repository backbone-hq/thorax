[package]
name = "thorax-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "thorax"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
cord.workspace = true
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
thorax-frontend.workspace = true
thorax-ops.workspace = true
